<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mi Plata</title>
<meta name="description" content="Control de gastos personal, privado y sin internet.">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Plata">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0e1014;--surface:#171a20;--surface2:#20242c;--surface3:#2b3039;--text:#eef1f5;--muted:#8b93a1;--line:#262a32;
  --accent:#2ec4a5;--accent-ink:#04231c;--exp:#ff5f6d;--inc:#2fcf7f;--warn:#f6b445;--tr:#7aa7ff;
  --r:18px;color-scheme:dark;
}
html[data-theme=light]{
  --bg:#f3f4f7;--surface:#ffffff;--surface2:#eceef2;--surface3:#dde1e7;--text:#12151a;--muted:#667085;--line:#e4e7ec;
  --accent:#119c80;--accent-ink:#ffffff;--exp:#e5484d;--inc:#16995a;--warn:#c58a08;--tr:#3d6fe0;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,select,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.35}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.neg{color:var(--exp)!important}
.pos{color:var(--inc)!important}
#view{padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 170px);max-width:560px;margin:0 auto}
/* ---------- barra inferior ---------- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0}
#tabbar button.on{color:var(--accent)}
#tabbar svg{width:24px;height:24px}
#actionbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(env(safe-area-inset-bottom) + 62px);display:flex;justify-content:center;align-items:center;gap:18px;pointer-events:none}
#actionbar button{pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fab{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:300;color:#fff}
.fab.exp{background:var(--exp)}.fab.inc{background:var(--inc)}
.fab.tr{width:48px;height:48px;font-size:20px;background:var(--surface3);color:var(--text)}
/* ---------- encabezado inicio ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.acct-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:8px 12px;flex:1;min-width:0}
.acct-btn .t{display:flex;flex-direction:column;min-width:0}
.acct-btn small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-btn b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-btn .chev{margin-left:auto;color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);font-size:18px;flex:none}
.icon-btn svg{width:20px;height:20px}
.period{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px}
.period .nav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:var(--muted)}
.period .plabel{font-weight:650;font-size:16px;padding:8px 14px;border-radius:12px}
.period .plabel span{color:var(--muted);font-weight:400;font-size:13px;margin-left:4px}
/* ---------- dona ---------- */
.chart-wrap{position:relative;margin:0 auto;touch-action:pan-y}
.chart-wrap svg{position:absolute;inset:0}
.chart-wrap svg circle{transition:stroke-dasharray .45s ease, stroke-dashoffset .45s ease}
.ring-cat{position:absolute;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface));font-size:21px;transition:transform .12s}
.ring-cat.on{background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.ring-cat:active{transform:translate(-50%,-50%) scale(.9)}
.ring-cat.more{background:var(--surface2);font-size:18px;color:var(--muted)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.center small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.center b{font-weight:700;color:var(--exp);line-height:1.1}
.center .ci{color:var(--inc);font-size:14px;font-weight:600}
.center .cb{font-size:11.5px;color:var(--muted);margin-top:4px}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.sumrow div{background:var(--surface);border-radius:14px;padding:10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sumrow small{font-size:11px;color:var(--muted)}
.sumrow b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-budget{background:var(--surface);border-radius:14px;padding:10px 12px;margin-bottom:12px;display:block;width:100%}
.mini-budget .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
/* ---------- segment ---------- */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;padding:7px 6px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:550}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
html[data-theme=light] .seg button.on{background:#fff}
/* ---------- listas ---------- */
.card{background:var(--surface);border-radius:var(--r);overflow:hidden}
.list{margin:10px 0}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;min-height:56px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .am{font-weight:600;white-space:nowrap}
.row .pct{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.row .chev{color:var(--muted)}
.row.dim{opacity:.5}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:color-mix(in srgb,var(--c,#888) 22%,var(--surface))}
.ic.round{border-radius:50%}
.subrows{background:var(--surface2)}
.subrow{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 64px;width:100%;border-bottom:1px solid var(--line);font-size:14px}
.subrow .grow{flex:1;min-width:0}
.subrow .d{font-size:12px;color:var(--muted)}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:14px 4px 6px;text-transform:capitalize}
.amt-exp{color:var(--exp)}.amt-inc{color:var(--inc)}.amt-tr{color:var(--tr)}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}
.empty .e{font-size:38px;display:block;margin-bottom:8px}
h1.title{font-size:28px;font-weight:750;margin:6px 2px 14px;letter-spacing:-.01em}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
h3.sec button{text-transform:none;letter-spacing:0;color:var(--accent);font-size:14px}
.hero{padding:18px;display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.hero small{color:var(--muted)}
.hero b{font-size:30px;font-weight:750}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:14px;font-weight:600;font-size:15px}
.btn.block{display:flex;width:100%;margin:10px 0}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--surface);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:color-mix(in srgb,var(--exp) 15%,transparent);color:var(--exp)}
.bar{height:8px;border-radius:6px;background:var(--surface3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--inc);transition:width .4s}
.bar i.w{background:var(--warn)}.bar i.x{background:var(--exp)}
.banner{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-radius:14px;padding:11px 12px;margin:8px 0 12px;font-size:13.5px}
.banner b{display:block}
.banner .x{margin-left:auto;color:var(--muted);font-size:18px;padding:4px}
/* ---------- presupuesto ---------- */
.bcard{padding:16px;margin-bottom:10px}
.bcard .big{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.bcard .big b{font-size:24px}
.bcard .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
.goal{padding:14px;display:flex;flex-direction:column;gap:8px;width:100%;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .h{display:flex;align-items:center;gap:10px}
.trend{padding:14px 10px 8px}
.trend svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 6px 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
/* ---------- ajustes ---------- */
.group{margin-bottom:18px}
.group .g-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 4px 8px;font-weight:600}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;border-bottom:1px solid var(--line);min-height:52px}
.srow:last-child{border-bottom:0}
.srow .si{font-size:19px;width:28px;text-align:center}
.srow .sl{flex:1}
.srow .sv{color:var(--muted);font-size:14px;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.danger .sl{color:var(--exp)}
/* ---------- hojas (sheets) ---------- */
#sheets{position:relative;z-index:50}
.sheet-wrap{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.tall{height:88vh;height:88dvh}
.sheet.full{top:0;max-height:none;height:100%;border-radius:0;padding-top:env(safe-area-inset-top)}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--surface3);margin:8px auto 2px;flex:none}
.sheet-body{overflow:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch;flex:1}
.sh-title{font-size:18px;font-weight:700;margin:6px 2px 14px;text-align:center}
.opt-list{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;border-bottom:1px solid var(--line);min-height:52px}
.opt:last-child{border-bottom:0}
.opt .oi{font-size:20px;width:26px;text-align:center}
.opt .ol{flex:1;display:flex;flex-direction:column}
.opt .os{font-size:12.5px;color:var(--muted)}
.opt .chk{color:var(--accent);font-weight:700}
.opt.danger{color:var(--exp)}
.opt.sel{color:var(--accent)}
.form .field{margin-bottom:12px}
.f-label{display:block;font-size:12.5px;color:var(--muted);margin:0 4px 6px}
.form input:not([type=checkbox]),.form select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.form input:focus,.form select:focus{border-color:var(--accent)}
.form input[type=date]{min-height:46px}
.field.toggle{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:12px;padding:10px 13px}
.switch{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:16px;background:var(--surface3);position:relative;transition:background .2s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch:checked{background:var(--inc)}
.switch:checked::after{transform:translateX(20px)}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 4px 12px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:var(--surface);border-radius:12px;padding:8px;max-height:168px;overflow:auto}
.emoji-grid button{font-size:21px;aspect-ratio:1;border-radius:9px;display:grid;place-items:center}
.emoji-grid button.sel{background:var(--surface3);box-shadow:inset 0 0 0 2px var(--accent)}
.color-grid{display:flex;flex-wrap:wrap;gap:9px;background:var(--surface);border-radius:12px;padding:10px}
.color-grid button{width:30px;height:30px;border-radius:50%;background:var(--c)}
.color-grid button.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.form-actions{display:flex;gap:10px;margin-top:16px}
.form-actions .btn{flex:1}
/* ---------- registro de movimiento ---------- */
.tx-sheet .sheet-body{display:flex;flex-direction:column;padding:4px 12px 8px;overflow:hidden}
.tx-head{display:flex;align-items:center;gap:8px;padding:4px 0 8px}
.tx-head .seg{flex:1}
.tx-head .icon-btn{background:transparent;width:38px}
.amount-box{border-radius:18px;padding:10px 16px;text-align:right;color:#fff;min-height:76px;display:flex;flex-direction:column;justify-content:flex-end}
.t-expense{background:var(--exp)}.t-income{background:var(--inc)}.t-transfer{background:var(--tr)}
.amount-box .expr{font-size:14px;opacity:.85;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount-box .amt{font-size:34px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 0 4px;align-items:center;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border-radius:20px;padding:8px 12px;font-size:13.5px;white-space:nowrap;position:relative;display:inline-flex;gap:5px;align-items:center}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;-webkit-appearance:none;appearance:none}
.chips .arrow{color:var(--muted)}
.note{flex:none;width:100%;background:var(--surface);border:0;border-radius:12px;padding:10px 12px;font-size:16px;outline:none;margin:4px 0 6px}
.xfield{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:6px 12px;margin:2px 0 4px;font-size:13.5px}
.xfield input{flex:1;background:transparent;border:0;outline:none;font-size:16px;text-align:right;padding:6px 0}
.cat-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px 2px;align-content:start;padding:4px 0;min-height:70px}
.cg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:14px}
.cg .ic{width:46px;height:46px;border-radius:50%;font-size:22px}
.cg .ic.add{background:var(--surface2);color:var(--muted)}
.cg .cn{font-size:11.5px;text-align:center;line-height:1.15;color:var(--muted);max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cg.sel .ic{background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.cg.sel .cn{color:var(--text);font-weight:600}
.transfer-hint{grid-column:1/-1;color:var(--muted);text-align:center;padding:24px 20px;font-size:14px}
.keypad{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:6px}
.k{height:min(54px,6.6vh);min-height:44px;border-radius:13px;background:var(--surface);font-size:22px;text-align:center;font-weight:500}
.k:active{filter:brightness(1.25)}
.k.op{background:var(--surface2);color:var(--muted)}
.k.ok{grid-column:span 2;color:#fff;font-size:17px;font-weight:700}
/* ---------- PIN ---------- */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 20px)}
#lock[hidden]{display:none}
.pin{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:320px;margin:0 auto}
.pin .logo{width:64px;height:64px;border-radius:18px}
.pin .pt{font-size:17px;font-weight:600;text-align:center}
.dots{display:flex;gap:16px;margin:6px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--text);border-color:var(--text)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
.pinpad button{aspect-ratio:1;max-height:76px;border-radius:50%;background:var(--surface);font-size:26px;display:grid;place-items:center;justify-self:center;width:76px}
.pinpad button.blank{background:transparent}
.pinpad button.fn{background:transparent;font-size:15px;color:var(--muted)}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:550;opacity:0;pointer-events:none;transition:.22s;z-index:200;display:flex;gap:14px;align-items:center;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:700}
html[data-theme=light] #toast button{color:#5ee0c4}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <div id="actionbar"></div>
  <nav id="tabbar"></nav>
</div>
<div id="sheets"></div>
<div id="lock" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   Mi Plata — control de gastos personal (PWA, 100% local)
   ===================================================================== */
const APP_VERSION = '1.1.0';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(d.getDate(), last)); return x; };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);

const DB = {

      r.onerror = () => rej(r.error);

  get(k) { return new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  set(k, v) { return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
};

function rangeFor(p, off, custom) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  let from, to;
  if (p === 'day') { from = to = addDays(t, off); }
  else if (p === 'week') { const dow = (t.getDay() - S().weekStart + 7) % 7; from = addDays(t, -dow + 7 * off); to = addDays(from, 6); }
  else if (p === 'month') {
    const md = S().monthStart || 1;
    let y = t.getFullYear(), m = t.getMonth();
    if (t.getDate() < md) m -= 1;
    from = new Date(y, m + off, md);
    to = addDays(new Date(from.getFullYear(), from.getMonth() + 1, md), -1);
  }
  else if (p === 'year') { const y = t.getFullYear() + off; from = new Date(y, 0, 1); to = new Date(y, 11, 31); }
  else if (p === 'custom' && custom) {
    const a = parseYmd(custom.a), b = parseYmd(custom.b), span = daysBetween(custom.a, custom.b) + 1;
    from = addDays(a, span * off); to = addDays(b, span * off);
  }
  else { from = new Date(2000, 0, 1); to = new Date(2999, 11, 31); }
  return { from, to, a: ymd(from), b: ymd(to) };
}

}

/* ---- Pagos recurrentes ---- */
function occurrence(start, freq, n) {
  const s = parseYmd(start);
  switch (freq) {
    case 'daily': return addDays(s, n);
    case 'weekly': return addDays(s, 7 * n);
    case 'biweekly': return addDays(s, 14 * n);
    case 'monthly': return addMonths(s, n);
    case 'yearly': return addMonths(s, 12 * n);
  }
  return addMonths(s, n);
}
function processRecurring() {
  const t = todayStr(); let made = 0;
  for (const r of state.recurring) {
    if (!r.active) continue;
    let guard = 0;
    while (guard++ < 1000) {
      const d = ymd(occurrence(r.start, r.freq, r.n));
      if (d > t || (r.end && d > r.end)) break;
      const tpl = r.tpl;
      if (acct(tpl.accountId)) {
        const tx = { id: uid(), type: tpl.type, amount: tpl.amount, accountId: tpl.accountId, date: d, note: tpl.note || '', created: Date.now(), recId: r.id };
        if (tpl.type === 'transfer') { tx.toAccountId = tpl.toAccountId; tx.toAmount = tpl.toAmount ?? tpl.amount; } else tx.categoryId = tpl.categoryId;
        state.tx.push(tx); made++;
      }
      r.n++;
    }
  }
  if (made) { save(); }
  return made;
}
const nextOcc = r => ymd(occurrence(r.start, r.freq, r.n));

    let done = false;

      const em = e.target.closest('[data-emoji]');
      if (em) { const k = em.closest('[data-field]').dataset.field; vals[k] = em.dataset.emoji; $$('.sel', em.parentElement).forEach(x => x.classList.remove('sel')); em.classList.add('sel'); return; }

        const inp = el.querySelector(`[name="${f.key}"]`); if (!inp) continue;

async function shareFile(name, content, type) {

    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  return true;
}

}

function viewHome() {
  const r = curRange();
  const list = state.tx.filter(t => inRange(t.date, r) && matchAcct(t));
  const exp = list.filter(t => t.type === 'expense' && (ui.acct === 'all' || t.accountId === ui.acct));
  const inc = list.filter(t => t.type === 'income' && (ui.acct === 'all' || t.accountId === ui.acct));
  const tE = sumMain(exp), tI = sumMain(inc);
  const byCat = {}; exp.forEach(t => { byCat[t.categoryId] = (byCat[t.categoryId] || 0) + amtMain(t); });
  const a = ui.acct === 'all' ? null : acct(ui.acct);
  const bal = a ? balance(a) : totalBalance();
  const balCur = a ? a.currency : S().currency;

  // dona
  const size = Math.max(280, Math.min(window.innerWidth - 24, 400));
  const c = size / 2, rr = size * 0.27, sw = size * 0.082;
  const isz = Math.round(Math.max(38, Math.min(48, size * 0.125)));
  const R = c - isz / 2 - 3;
  const C = 2 * Math.PI * rr;
  const segs = Object.entries(byCat).map(([id, v]) => ({ v, color: cat(id)?.color || '#888' })).sort((x, y) => y.v - x.v);
  let parts = `<circle cx="${c}" cy="${c}" r="${rr}" fill="none" stroke="var(--surface2)" stroke-width="${sw}"/>`;
  if (tE > 0) {
    let off = 0; const gap = segs.length > 1 ? 2.5 : 0;
    for (const s of segs) {
      const len = C * s.v / tE, dl = Math.max(len - gap, 0.8);
      parts += `<circle cx="${c}" cy="${c}" r="${rr}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${dl.toFixed(2)} ${(C - dl).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`;
      off += len;
    }
  }
  const ec = cats('expense');
  const slots = Math.max(8, Math.min(16, Math.floor((2 * Math.PI * R) / (isz + 9))));
  const ringCats = ec.length > slots ? ec.slice(0, slots - 1) : ec;
  const nRing = ringCats.length + (ec.length > slots ? 1 : 0);
  const ringBtns = ringCats.map((k, i) => {
    const ang = (-90 + i * 360 / nRing) * Math.PI / 180;
    return `<button class="ring-cat ${byCat[k.id] ? 'on' : ''}" data-act="add-cat" data-id="${k.id}" style="--c:${k.color};left:${(c + R * Math.cos(ang)).toFixed(1)}px;top:${(c + R * Math.sin(ang)).toFixed(1)}px;width:${isz}px;height:${isz}px" aria-label="${esc(k.name)}">${k.icon}</button>`;
  }).join('') + (ec.length > slots ? (() => { const ang = (-90 + (nRing - 1) * 360 / nRing) * Math.PI / 180; return `<button class="ring-cat more" data-act="add" data-type="expense" style="left:${(c + R * Math.cos(ang)).toFixed(1)}px;top:${(c + R * Math.sin(ang)).toFixed(1)}px;width:${isz}px;height:${isz}px" aria-label="Más categorías">•••</button>`; })() : '');
  const eStr = money(tE);
  const fs = eStr.length <= 9 ? 27 : eStr.length <= 12 ? 23 : eStr.length <= 15 ? 19 : 16;

  // presupuesto en centro
  let centerB = '', miniB = '';
  const B = state.budget.amount || 0;
  if (B > 0 && ui.period === 'month' && ui.acct === 'all') {
    const left = B - tE;
    centerB = `<span class="cb num">${left >= 0 ? 'Quedan ' + money(left) : 'Excedido ' + money(-left)}</span>`;
    miniB = `<button class="mini-budget" data-act="tab" data-tab="budget"><div class="l"><span>Presupuesto del mes</span><span class="num ${left < 0 ? 'neg' : 'muted'}">${money(tE)} / ${money(B)}</span></div>${barHTML(tE, B)}</button>`;
  }

  // lista
  let listHTML = '';
  if (ui.mode === 'cat') {
    const grp = (txs, type) => {
      const m = {};
      txs.forEach(t => { (m[t.categoryId] = m[t.categoryId] || []).push(t); });
      const tot = sumMain(txs);
      return Object.entries(m).map(([id, ts]) => ({ c: cat(id) || { name: 'Sin categoría', icon: '❔', color: '#888' }, id, ts, v: sumMain(ts) }))
        .sort((x, y) => y.v - x.v)

          const key = type + g.id, open = ui.exp[key];
          return `<button class="row" data-act="toggle-cat" data-key="${key}"><span class="ic round" style="--c:${g.c.color}">${g.c.icon}</span><span class="grow"><span class="nm">${esc(g.c.name)}</span><span class="sub">${g.ts.length} ${g.ts.length === 1 ? 'movimiento' : 'movimientos'}</span></span><span class="pct num">${tot ? Math.round(g.v / tot * 100) : 0}%</span><span class="am num amt-${type === 'expense' ? 'exp' : 'inc'}">${money(g.v)}</span></button>` +
            (open ? `<div class="subrows">${g.ts.sort((x, y) => y.date.localeCompare(x.date) || y.created - x.created).map(t => `<button class="subrow" data-act="edit-tx" data-id="${t.id}"><span class="grow"><div>${esc(t.note || g.c.name)}</div><div class="d">${dateLabel(t.date)} · ${esc(acct(t.accountId)?.name || '')}${t.recId ? ' · 🔁' : ''}</div></span><span class="num amt-${type === 'expense' ? 'exp' : 'inc'}">${money(t.amount, acur(t.accountId))}</span></button>`).join('')}</div>` : '');
        }).join('');

    listHTML = Object.entries(days).map(([d, ts]) => {
      const net = ts.reduce((s, t) => s + (t.type === 'income' ? amtMain(t) : t.type === 'expense' ? -amtMain(t) : 0), 0);
      return `<div class="day-h"><span>${d === todayStr() ? 'Hoy' : d === ymd(addDays(new Date(), -1)) ? 'Ayer' : fmt.wds.format(parseYmd(d))}</span><span class="num">${net ? (net > 0 ? '+' : '') + money(net) : ''}</span></div><div class="card">${ts.map(txRow).join('')}</div>`;
    }).join('');
  }
  if (!list.length) listHTML = `<div class="empty"><span class="e">🪙</span>Sin movimientos en este periodo.<br>Toca una categoría del círculo o el botón <b>−</b> para registrar un gasto.</div>`;

  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const install = S().installHint && isIOS && !standalone ? `<div class="banner"><span style="font-size:22px">📲</span><span><b>Instálala en tu iPhone</b>Toca Compartir y luego "Agregar a inicio".</span><button class="x" data-act="hide-install" aria-label="Cerrar">✕</button></div>` : '';

  const lbk = S().lastBackup, lbDays = lbk ? daysBetween(lbk, todayStr()) : null;
  const needBk = state.tx.length >= 10 && (lbDays === null || lbDays >= 7) && !(S().backupSnooze && S().backupSnooze > todayStr());
  const bkBanner = needBk ? `<div class="banner"><span style="font-size:22px">💾</span><span><b>${lbDays === null ? 'Aún no tienes respaldo' : 'Tu último respaldo fue hace ' + lbDays + ' días'}</b>Tus datos solo están en este iPhone. <button data-act="backup" style="color:var(--accent);font-weight:600">Crear respaldo</button></span><button class="x" data-act="snooze-backup" aria-label="Recordar después">✕</button></div>` : '';
  return `${install}${bkBanner}

    <button class="icon-btn" data-act="search" aria-label="Buscar">${ICON.search}</button>
  </div>
  <div class="period">

    <button class="nav" data-act="next" ${ui.period === 'all' ? 'disabled' : ''} aria-label="Siguiente">›</button>
  </div>
  <div class="chart-wrap" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">${parts}</svg>
    ${ringBtns}
    <div class="center" style="max-width:${(rr * 2 - sw).toFixed(0)}px"><small>Gastos</small><b class="num" style="font-size:${fs}px">${eStr}</b><span class="ci num">+${money(tI)}</span>${centerB}</div>
  </div>
  <div class="sumrow">
    <div><small>Ingresos</small><b class="num pos">${money(tI)}</b></div>
    <div><small>Gastos</small><b class="num neg">${money(tE)}</b></div>
    <div><small>Balance</small><b class="num ${tI - tE < 0 ? 'neg' : ''}">${money(tI - tE)}</b></div>

  ${miniB}
  <div class="seg"><button data-act="mode" data-mode="cat" class="${ui.mode === 'cat' ? 'on' : ''}">Por categoría</button><button data-act="mode" data-mode="date" class="${ui.mode === 'date' ? 'on' : ''}">Por fecha</button></div>
  ${listHTML}`;
}

function viewBudget() {
  const r = rangeFor('month', ui.boff);
  const mtx = state.tx.filter(t => inRange(t.date, r));
  const exp = mtx.filter(t => t.type === 'expense');
  const spent = sumMain(exp);
  const B = state.budget.amount || 0;
  const t = todayStr(), isCur = inRange(t, r);
  const daysLeft = isCur ? daysBetween(t, r.b) + 1 : 0;
  const daysPassed = isCur ? daysBetween(r.a, t) + 1 : daysBetween(r.a, r.b) + 1;
  const left = B - spent;
  const g = B > 0 ? `<div class="card bcard"><div class="muted" style="font-size:13px">Presupuesto mensual</div>
      <div class="big"><b class="num ${left < 0 ? 'neg' : ''}">${left >= 0 ? money(left) : '−' + money(-left)}</b><span class="muted num">de ${money(B)}</span></div>
      ${barHTML(spent, B)}
      <div class="meta"><span class="num">Gastado ${money(spent)} (${Math.round(spent / B * 100)}%)</span><span class="num">${isCur && left > 0 ? money(left / daysLeft) + '/día · ' + daysLeft + ' días' : (left < 0 ? 'Te pasaste' : '')}</span></div>
      <button class="btn soft block" style="margin-bottom:0" data-act="budget-edit">Editar presupuesto</button></div>`
    : `<div class="card bcard"><div style="font-weight:650;font-size:16px;margin-bottom:4px">Define tu presupuesto del mes</div><div class="muted" style="font-size:13.5px">Te mostraremos cuánto te queda y cuánto puedes gastar por día.</div><button class="btn primary block" style="margin-bottom:0" data-act="budget-edit">Definir presupuesto</button></div>`;
  const bc = cats('expense').filter(c => c.budget > 0).map(c => {
    const s = sumMain(exp.filter(x => x.categoryId === c.id));
    return `<button class="row" data-act="cat-budget" data-id="${c.id}" style="flex-wrap:wrap;gap:8px 12px"><span class="ic round" style="--c:${c.color}">${c.icon}</span><span class="grow"><span class="nm">${esc(c.name)}</span><span class="sub num">${money(s)} de ${money(c.budget)}</span></span><span class="am num ${s > c.budget ? 'neg' : ''}">${s > c.budget ? '−' + money(s - c.budget) : money(c.budget - s)}</span><span style="flex-basis:100%;padding-left:50px">${barHTML(s, c.budget)}</span></button>`;
  }).join('');
  const goals = state.goals.map(go => {
    const p = go.target > 0 ? go.saved / go.target : 0;
    let extra = '';
    if (go.deadline && go.saved < go.target) {
      const months = Math.max(1, Math.ceil(daysBetween(t, go.deadline) / 30.44));
      extra = daysBetween(t, go.deadline) < 0 ? 'Fecha vencida' : `${money((go.target - go.saved) / months)}/mes · ${months} ${months === 1 ? 'mes' : 'meses'}`;
    } else if (go.saved >= go.target) extra = '¡Meta cumplida! 🎉';
    return `<button class="goal" data-act="goal-open" data-id="${go.id}"><span class="h"><span class="ic round" style="--c:${go.color}">${go.icon}</span><span class="grow" style="flex:1;display:flex;flex-direction:column;min-width:0"><span style="font-weight:600">${esc(go.name)}</span><span class="muted num" style="font-size:12.5px">${money(go.saved)} de ${money(go.target)}</span></span><b class="num">${Math.round(p * 100)}%</b></span><div class="bar"><i style="width:${Math.min(100, p * 100).toFixed(1)}%;background:${go.color}"></i></div>${extra ? `<span class="muted" style="font-size:12.5px">${extra}</span>` : ''}</button>`;
  }).join('');
  const avg = daysPassed > 0 ? spent / daysPassed : 0;
  return `<h1 class="title">Presupuesto</h1>
  <div class="period"><button class="nav" data-act="bprev" aria-label="Mes anterior">‹</button><span class="plabel">${esc(periodLabel('month', r))}</span><button class="nav" data-act="bnext" aria-label="Mes siguiente">›</button></div>

  ${bc ? `<div class="card">${bc}</div>` : `<div class="card"><div class="empty" style="padding:18px">Pon un tope a categorías como Restaurantes o Salidas y mira cuánto te queda en cada una.</div></div>`}
  <h3 class="sec">Metas de ahorro <button data-act="goal-add">＋ Nueva</button></h3>
  ${goals ? `<div class="card">${goals}</div>` : `<div class="card"><div class="empty" style="padding:18px"><span class="e">🎯</span>Crea una meta: un viaje, un fondo de emergencia, tu casa…</div></div>`}
  <h3 class="sec">Últimos 6 meses</h3>
  <div class="card trend">${trendSVG(ui.boff)}<div class="legend"><span><i style="background:var(--inc)"></i>Ingresos</span><span><i style="background:var(--exp)"></i>Gastos</span><span style="margin-left:auto" class="num">Promedio: ${money(avg)}/día</span></div></div>`;
}
function trendSVG(off) {
  const ms = [];
  for (let i = 5; i >= 0; i--) {
    const r = rangeFor('month', off - i), tx = state.tx.filter(t => inRange(t.date, r));
    ms.push({ l: clean(fmt.ms.format(r.from)), i: sumMain(tx.filter(t => t.type === 'income')), e: sumMain(tx.filter(t => t.type === 'expense')) });
  }
  const max = Math.max(1, ...ms.flatMap(m => [m.i, m.e]));
  const W = 320, H = 150, top = 8, bot = 22, ch = H - top - bot, gw = W / 6, bw = Math.min(16, gw * .28);
  let s = `<line x1="0" x2="${W}" y1="${H - bot + .5}" y2="${H - bot + .5}" stroke="var(--line)"/>`;
  ms.forEach((m, k) => {
    const x = k * gw + gw / 2, hi = ch * m.i / max, he = ch * m.e / max;
    s += `<rect x="${(x - bw - 1.5).toFixed(1)}" y="${(H - bot - hi).toFixed(1)}" width="${bw}" height="${Math.max(hi, 0).toFixed(1)}" rx="3" fill="var(--inc)"/>`;
    s += `<rect x="${(x + 1.5).toFixed(1)}" y="${(H - bot - he).toFixed(1)}" width="${bw}" height="${Math.max(he, 0).toFixed(1)}" rx="3" fill="var(--exp)"/>`;
    s += `<text x="${x}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${m.l}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos 6 meses">${s}</svg>`;
}

function evalExpr(e) {

function sanitizeImport(d) {

  }
  const rIds = new Set(recurring.map(r => r.id));
  const tx = [];

    if (!t || !isId(t.id) || !isDate(t.date) || !okMove(t) || !uniq(t.id)) { dropped++; continue; }
    const o = { id: t.id, type: t.type, amount: round2(t.amount), accountId: t.accountId, date: t.date, note: str(t.note, 120), created: isNum(t.created, 0, 1e14) ? t.created : Date.now() };

    weekStart: s.weekStart === 0 ? 0 : 1,
    monthStart: Number.isInteger(s.monthStart) && s.monthStart >= 1 && s.monthStart <= 28 ? s.monthStart : 1,
    theme: ['auto', 'dark', 'light'].includes(s.theme) ? s.theme : 'auto',
    period: ['day', 'week', 'month', 'year', 'all'].includes(s.period) ? s.period : 'month',
    rates, defaultAccount: aIds.has(s.defaultAccount) ? s.defaultAccount : null, lastAccount: aIds.has(s.lastAccount) ? s.lastAccount : null,
    lastBackup: isDate(s.lastBackup) ? s.lastBackup : null, installHint: s.installHint === true,
  };
  const budget = { amount: d.budget && isNum(d.budget.amount, 0, MAXV) ? round2(d.budget.amount) : 0 };
  return { data: { v: 1, settings, accounts, categories, tx, recurring, goals, budget }, dropped };
}
function doRestore() {
  const inp = $('#restoreFile'); if (!inp) return;
  inp.value = '';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 25 * 1024 * 1024) return toast('El archivo es demasiado grande para ser un respaldo');
    let d;
    try { d = JSON.parse(await f.text()); } catch (e) { return toast('Ese archivo no es un respaldo de Mi Plata'); }
    if (d && d.format === ENC_FORMAT) {
      if (!crypto.subtle) return toast('Abre la app desde su ícono para restaurar respaldos cifrados');
      const v = await formSheet('Respaldo cifrado', [{ key: 'p', type: 'password', label: 'Contraseña del respaldo' }], { ok: 'Abrir', validate: x => !x.p ? 'Escribe la contraseña' : null });
      if (!v) return;
      toast('Descifrando…');
      try { d = await decryptJSON(d, v.p); } catch (e) { return toast('Contraseña incorrecta o archivo dañado'); }
    }
    let res;
    try { res = sanitizeImport(d); } catch (e) { return toast('Ese archivo no es un respaldo válido de Mi Plata'); }
    const { data, dropped } = res;
    const msg = `¿Reemplazar tus datos actuales por este respaldo? Trae ${data.tx.length} movimientos y ${data.accounts.length} cuentas${dropped ? ` (se descartan ${dropped} registros dañados)` : ''}.`;
    if (!(await confirmDlg(msg, 'Restaurar'))) return;
    const keep = {}; DEVICE_KEYS.forEach(k => { keep[k] = S()[k]; });
    state = migrate(data); Object.assign(state.settings, keep);
    ui.acct = 'all'; ui.off = 0; processRecurring(); await persist(); render(); toast('Respaldo restaurado');
  };
  inp.click();
}
async function doCSV() {
  const v = await choose('Exportar a CSV', [{ label: 'Periodo visible en Inicio', sub: periodLabel(ui.period, curRange()), value: 'p', icon: '📆' }, { label: 'Todos los movimientos', value: 'all', icon: '🗂️' }]);
  if (!v) return;
  const r = curRange();
  const list = state.tx.filter(t => v === 'all' || inRange(t.date, r)).sort((a, b) => a.date.localeCompare(b.date));
  const T = { expense: 'Gasto', income: 'Ingreso', transfer: 'Transferencia' };
  const rows = [['Fecha', 'Tipo', 'Cuenta', 'Cuenta destino', 'Categoría', 'Monto', 'Moneda', `Monto ${S().currency}`, 'Nota']];
  list.forEach(t => rows.push([t.date, T[t.type], acct(t.accountId)?.name, t.type === 'transfer' ? acct(t.toAccountId)?.name : '', t.type === 'transfer' ? '' : cat(t.categoryId)?.name, (t.type === 'expense' ? -t.amount : t.amount), acur(t.accountId), round2(t.type === 'expense' ? -amtMain(t) : amtMain(t)), t.note]));
  const csv = '﻿' + rows.map(r => r.map(c => typeof c === 'number' ? numStr(c) : `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  shareFile(`mi-plata-${v === 'all' ? 'todo' : r.a + '_' + r.b}.csv`, csv, 'text/csv');
}
async function doWipe() {
  if (!(await confirmDlg('¿Borrar TODOS tus datos? Esto no se puede deshacer.', 'Borrar todo'))) return;
  if (!(await confirmDlg('¿Seguro? Te recomendamos hacer un respaldo antes.', 'Sí, borrar todo'))) return;
  const keep = { theme: S().theme };
  state = defaultState(); Object.assign(state.settings, keep);
  ui.acct = 'all'; ui.off = 0; await persist(); render(); toast('Datos borrados');
}

/* ===================== Eventos principales ===================== */
const actions = {
  tab: el => { ui.tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  add: el => openTx({ type: el.dataset.type }),
  'add-cat': el => openTx({ type: 'expense', categoryId: el.dataset.id }),
  'edit-tx': el => { const t = state.tx.find(x => x.id === el.dataset.id); if (t) openTx({ tx: t }); },
  'toggle-cat': el => { const k = el.dataset.key; ui.exp[k] = !ui.exp[k]; render(); },
  mode: el => { ui.mode = el.dataset.mode; render(); },
  prev: () => { ui.off--; render(); },
  next: () => { ui.off++; render(); },
  search: () => openSearch(),
  'snooze-backup': () => { S().backupSnooze = ymd(addDays(new Date(), 3)); save(); render(); toast('Te lo recordamos en 3 días'); },
  'hide-install': () => { S().installHint = false; save(); render(); },
  'pick-period': async () => {
    const v = await choose('Ver por', [...['day', 'week', 'month', 'year', 'all'].map(k => ({ label: PERIOD_NAMES[k], value: k, sel: ui.period === k })), { label: 'Rango de fechas…', value: 'custom', sel: ui.period === 'custom' }, { label: 'Volver a hoy', value: 'today', icon: '↩️' }]);
    if (!v) return;
    if (v === 'today') { ui.off = 0; return render(); }
    if (v === 'custom') {
      const r = curRange();
      const x = await formSheet('Rango de fechas', [{ key: 'a', type: 'date', label: 'Desde', value: ui.period === 'all' ? todayStr() : r.a }, { key: 'b', type: 'date', label: 'Hasta', value: ui.period === 'all' ? todayStr() : r.b }], { ok: 'Aplicar', validate: q => !q.a || !q.b ? 'Elige ambas fechas' : q.a > q.b ? 'La fecha inicial debe ser anterior' : null });
      if (!x) return;
      ui.custom = { a: x.a, b: x.b }; ui.period = 'custom'; ui.off = 0; return render();
    }
    ui.period = v; ui.off = 0; S().period = v; save(); render();
  },
  'pick-acct': async () => {
    const v = await choose('Ver cuenta', [{ label: 'Todas las cuentas', icon: '👛', value: 'all', sel: ui.acct === 'all', sub: money(totalBalance()) }, ...activeAccounts().map(a => ({ label: a.name, icon: a.icon, value: a.id, sel: ui.acct === a.id, sub: money(balance(a), a.currency) }))]);
    if (v) { ui.acct = v; render(); }
  },
  'acct-open': async el => {
    const a = acct(el.dataset.id); if (!a) return;
    const v = await choose(`${a.icon} ${a.name}`, [{ label: 'Ver movimientos', icon: '📋', value: 'view' }, { label: 'Transferir desde esta cuenta', icon: '⇄', value: 'tr' }, { label: 'Editar cuenta', icon: '✏️', value: 'edit' }]);
    if (v === 'view') { ui.acct = a.archived ? 'all' : a.id; ui.tab = 'home'; ui.mode = 'date'; render(); }
    if (v === 'tr') openTx({ type: 'transfer', accountId: a.id });
    if (v === 'edit') editAccount(a);
  },
  'acct-add': () => editAccount(null),
  bprev: () => { ui.boff--; render(); },
  bnext: () => { ui.boff++; render(); },
  'budget-edit': async () => {
    const v = await formSheet('Presupuesto mensual', [{ key: 'amount', type: 'money', label: '¿Cuánto quieres gastar como máximo al mes?', value: state.budget.amount }, { type: 'hint', text: 'Pon 0 para quitarlo. El mes empieza el día que elegiste en Ajustes (hoy: día ' + S().monthStart + ').' }]);
    if (v) { state.budget.amount = round2(v.amount); save(); render(); }
  },
  'cat-budget': el => editCategory(cat(el.dataset.id)),
  'cat-budgets': async () => {
    const list = cats('expense');
    const v = await formSheet('Presupuesto por categoría', [{ type: 'hint', text: 'Tope mensual para cada categoría. Déjalo vacío para no limitarla.' }, ...list.map(c => ({ key: c.id, type: 'money', label: `${c.icon} ${c.name}`, value: c.budget, placeholder: 'Sin límite' }))], { tall: true });
    if (!v) return;
    list.forEach(c => { c.budget = round2(v[c.id] || 0); });
    save(); render();
  },
  'goal-add': () => editGoal(null),
  'goal-open': el => { const g = state.goals.find(x => x.id === el.dataset.id); if (g) openGoal(g); },
  'set-currency': async () => {
    const v = await choose('Moneda principal', CURRENCIES.map(([c, n]) => ({ label: `${c} · ${n}`, value: c, sel: S().currency === c })));
    if (!v || v === S().currency) return;
    const old = S().currency;
    const keep = await choose(`Cambiar a ${v}`, [{ label: `Cambiar también mis cuentas en ${old} a ${v}`, value: 'all', icon: '🔄' }, { label: 'Solo la moneda de los totales', value: 'main', icon: '📊' }]);
    if (!keep) return;
    if (keep === 'all') state.accounts.forEach(a => { if (a.currency === old) a.currency = v; });
    S().currency = v; S().rates = {}; save(); render();
    if (state.accounts.some(a => a.currency !== v)) toast('Revisa las tasas de cambio en Ajustes');
  },
  'set-rates': async () => {
    const main = S().currency;
    const curs = [...new Set([...state.accounts.map(a => a.currency), 'USD', 'EUR'])].filter(c => c !== main);
    const v = await formSheet('Tasas de cambio', [{ type: 'hint', text: `Cuántos ${main} equivale 1 unidad de cada moneda. Se usan para sumar cuentas en otras monedas.` }, ...curs.map(c => ({ key: c, type: 'money', label: `1 ${c} = ? ${main}`, value: S().rates[c] || '' }))], { tall: true });
    if (!v) return;
    curs.forEach(c => { if (v[c] > 0) S().rates[c] = v[c]; });
    save(); render(); toast('Tasas actualizadas');
  },
  'set-week': async () => { const v = await choose('La semana empieza el', [{ label: 'Lunes', value: 1, sel: S().weekStart === 1 }, { label: 'Domingo', value: 0, sel: S().weekStart === 0 }]); if (v !== null) { S().weekStart = v; save(); render(); } },
  'set-month': async () => {
    const v = await formSheet('Inicio del mes', [{ type: 'hint', text: 'Si te pagan, por ejemplo, el 15, tu "mes" puede ir del 15 al 14. Elige entre 1 y 28.' }, { key: 'd', type: 'int', label: 'Día de inicio', value: S().monthStart }], { validate: q => q.d < 1 || q.d > 28 ? 'Elige un día entre 1 y 28' : null });
    if (v) { S().monthStart = v.d; save(); render(); }
  },
  'set-theme': async () => { const v = await choose('Apariencia', [['auto', 'Automática (según el iPhone)'], ['dark', 'Oscura'], ['light', 'Clara']].map(([k, l]) => ({ label: l, value: k, sel: S().theme === k }))); if (v) { S().theme = v; save(); render(); } },
  'set-defacct': async () => {
    const v = await choose('Cuenta predeterminada', [{ label: 'La última que usé', value: '__last', sel: !S().defaultAccount }, ...activeAccounts().map(a => ({ label: a.name, icon: a.icon, value: a.id, sel: S().defaultAccount === a.id }))]);
    if (v) { S().defaultAccount = v === '__last' ? null : v; save(); render(); }
  },
  'cat-manager': () => openCatManager(),
  'rec-manager': () => openRecManager(),
  pin: () => managePin(),
  bio: () => manageBio(),
  backup: () => doBackup(),
  restore: () => doRestore(),
  csv: () => doCSV(),
  wipe: () => doWipe(),
  about: () => choose('Mi Plata ' + APP_VERSION, [{ label: `${state.tx.length} movimientos · ${state.accounts.length} cuentas`, value: null, icon: '📊' }, { label: 'Tus datos nunca salen de este iPhone', value: null, icon: '🔒' }, { label: 'Sin conexiones externas (CSP activa)', value: null, icon: '🛡️' }, { label: 'Respaldos cifrados con AES-256', value: null, icon: '🔐' }]),
};
$('#app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = actions[el.dataset.act]; if (f) f(el, e);
});
// deslizar el círculo para cambiar de periodo
let sw0 = null;
$('#view').addEventListener('touchstart', e => { sw0 = e.target.closest('.chart-wrap') && ui.period !== 'all' ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null; }, { passive: true });
$('#view').addEventListener('touchend', e => {
  if (!sw0) return; const t = e.changedTouches[0], dx = t.clientX - sw0.x, dy = t.clientY - sw0.y; sw0 = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 50) { ui.off += dx < 0 ? 1 : -1; render(); }
});
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => ui.tab === 'home' && render(), 150); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); persist(); }
  else {
    if (S().pinHash && hiddenAt && Date.now() - hiddenAt > 60000) showLock();
    if (processRecurring()) render();
  }
});
window.addEventListener('pagehide', () => persist());

function applyTheme() {
  const t = S().theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : S().theme;
  if (document.documentElement.dataset.theme !== t) {
    document.documentElement.dataset.theme = t;
    $('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#f3f4f7' : '#0e1014');
  }
}
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => state && render());

/* ===================== Arranque ===================== */
(async function init() {
  await load();
  ui.period = S().period === 'custom' ? 'month' : (S().period || 'month');
  await checkBio();
  processRecurring();
  render();
  if (S().pinHash) showLock();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
